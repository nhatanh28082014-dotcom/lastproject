<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm Kiếm Phim | Happy Cinema</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./styles/search.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">

            <a class="navbar-brand fw-bold fs-2" href="./index.html">
                🎬 Happy Cinema
            </a>

            <button class="btn btn-outline-light" onclick="window.location.href='index.html'">
                Trang chủ
            </button>

        </div>
    </nav>

    <!-- Search -->
    <div class="container mt-5">

        <h2 class="text-center mb-4">
            Tìm kiếm phim
        </h2>

        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="input-group">

                    <input
                        type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Nhập tên phim..."
                    >

                    <button
                        class="btn btn-danger"
                        id="searchBtn"
                    >
                        Tìm kiếm
                    </button>

                </div>

            </div>
        </div>

        <div class="row mt-5 g-4" id="searchResults">

        </div>

    </div>

    <script src="./scripts/search.js"></script>

</body>
</html>
