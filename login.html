<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập MOVIE</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CSS riêng -->
  <link rel="stylesheet" href="./styles/login.css">
</head>
<body class="bg-dark d-flex justify-content-center align-items-center vh-100">
  <div class="login-box rounded shadow p-4">
    <div class="text-center mb-3">
      <!-- Icon MOVIE -->
      <img src="https://cdn-icons-png.flaticon.com/512/2798/2798007.png" alt="Movie Icon" width="50">
      <h1 class="fw-bold mt-2">MOVIE</h1>
      <p class="text-secondary">Đăng nhập để xem phim</p>
    </div>

    <!-- Form đăng nhập -->
    <form>
      <div class="mb-3">
        <label for="username" class="form-label">Tên đăng nhập</label>
        <input type="text" class="form-control" id="username" placeholder="Nhập tên đăng nhập">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Mật khẩu</label>
        <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu">
      </div>
      <button type="submit" class="btn btn-dark w-100 fw-bold">Đăng nhập</button>
    </form>

    <!-- Link chuyển sang đăng ký -->
    <p class="text-center mt-3 text-dark">
      Chưa có tài khoản? 
      <a href="#" id="register-link" class="fw-bold text-danger text-decoration-none">Đăng ký ngay</a>
    </p>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <!-- JS riêng -->
  <script src="./scripts/login.js"></script>
</body>
</html>
