<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Cinema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles/index.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-light" href="#">Happy Cinema</a>
      <div class="ms-auto d-flex align-items-center" id="nav-actions">
        <!-- JS sẽ render: Xin chào currentUser, nút Search, nút Đăng nhập/Đăng xuất -->
      </div>
    </div>
  </nav>

  <!-- Banner -->
  <section class="hero-banner d-flex justify-content-center align-items-center text-center text-light">
    <div class="banner-content">
      <h1 class="fw-bold display-5">Trải Nghiệm Điện Ảnh Đỉnh Cao</h1>
      <p class="lead mt-3">Mỗi khung hình là một hành trình — nơi cảm xúc và câu chuyện hòa quyện cùng ánh sáng màn bạc.</p>
    </div>
  </section>

  <!-- Carousel động -->
  <section id="carousel-section" class="py-5">
    <div class="container">
      <h2 class="text-center mb-4">Phim đang công chiếu 🎥</h2>
      <div id="carouselExampleCaptions" class="carousel slide">
        <div class="carousel-indicators" id="carousel-indicators">
          <!-- JS sẽ render nút indicator -->
        </div>
        <div class="carousel-inner" id="carousel-inner">
          <!-- JS sẽ render các slide -->
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>
    </div>
  </section>

  <!-- Card động -->
  <section id="trending-section" class="py-5">
    <div class="container">
      <h2 class="text-center mb-4">Phim Trending 🔥</h2>
      <div class="row g-4" id="trending-cards">
        <!-- JS sẽ render danh sách phim trending -->
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer py-4 text-center bg-dark text-light">
    <div class="container">
      <p>Thank you for choosing Happy Cinema. Enjoy your favorite movies 🎬</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./scripts/index.js"></script>
</body>
</html>
